<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>训练</title>
  <meta name="description" content="训练清单与组间秒表">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="训练">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <script>
    // 外观预览钩子：?theme=a|b|c 额外加载 themes/<x>.css 覆盖样式。选定风格后并入 style.css，这段和 themes/ 一起删。
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t && /^[abc]$/.test(t)) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = './themes/' + t + '.css';
        document.head.appendChild(l);
        document.documentElement.setAttribute('data-theme-style', t);
      }
    })();
  </script>
</head>
<body>
  <main id="app">
    <p class="muted">加载中…</p>
  </main>
  <footer class="app-footer">
    <p id="status" class="muted"></p>
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
